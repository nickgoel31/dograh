server {
    listen 80;
    root /usr/share/nginx/html;

    # The main nginx strips the /new/ prefix before it gets here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
